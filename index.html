<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIoT: Інтелектуальна система обміну даними (ШІ-аномалії)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #16161a;
            --panel-bg: #24262d;
            --text-main: #e4e4e6;
            --text-muted: #94a1b2;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-ai: #a855f7; /* Фіолетовий для ШІ */
            --border-color: #3f414d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard {
            background-color: var(--panel-bg);
            border-radius: 12px;
            width: 100%;
            max-width: 1000px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--text-main);
            display: block;
            margin-top: 4px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 260px;
            background-color: #1a1c23;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            overflow: hidden;
        }

        #simCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .charts-wrapper {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-container {
            flex: 1;
            height: 180px;
            background-color: #1a1c23;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background-color: #1a1c23;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(255, 255, 255, 0.02);
            padding: 8px 12px;
            border-radius: 6px;
        }

        .ai-panel {
            grid-column: span 2;
            display: flex;
            gap: 15px;
            border: 1px solid var(--accent-ai);
            background-color: rgba(168, 85, 247, 0.05);
            padding: 12px;
            border-radius: 8px;
            align-items: center;
        }

        input[type=range] {
            flex-grow: 1;
            margin: 0 15px;
            accent-color: var(--accent-blue);
        }
        
        input[type=range].ai-slider {
            accent-color: var(--accent-ai);
        }

        button {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            width: 100%;
        }

        button:hover { background-color: #4f5160; }
        
        button.active-ai {
            background-color: var(--accent-ai);
            color: white;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .toggle-switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-blue); }
        input:checked + .slider:before { transform: translateX(26px); }

        .chart-title {
            text-align: center;
            font-size: 0.8em;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .ai-label {
            color: var(--accent-ai);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

    </style>
</head>
<body>

<div class="dashboard">
    <div class="header-stats">
        <div>Інтелектуальний обмін даними</div>
        <div>Відфільтровано<span class="stat-value" id="val-blocked">0</span></div>
        <div>Генератор<span class="stat-value" id="val-mode" style="color: var(--accent-green)">Вимкнено</span></div>
        <div>Канал A<span class="stat-value" id="val-bw-a" style="color: var(--accent-red)">0%</span></div>
        <div>Канал B (Edge)<span class="stat-value" id="val-bw-b" style="color: var(--accent-green)">0%</span></div>
    </div>

    <div class="canvas-container">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="charts-wrapper">
        <div class="chart-container">
            <div class="chart-title">Фізичний рівень (АЦП Сенсора)</div>
            <canvas id="sensorChart"></canvas>
        </div>
        <div class="chart-container">
            <div class="chart-title">Мережеве навантаження (Пакети/с)</div>
            <canvas id="networkChart"></canvas>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Поріг Edge-фільтра</label>
            <input type="range" id="filterSlider" min="0" max="1" step="0.1" value="0.8">
            <span id="filterVal">0.8</span>
        </div>
        
        <div class="control-group">
            <label>Живлення системи</label>
            <label class="toggle-switch">
                <input type="checkbox" id="activeToggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <!-- Панель керування ШІ -->
        <div class="ai-panel">
            <div style="flex: 1;">
                <button id="anomalyBtn">🤖 Активувати ШІ-генератор аномалій</button>
            </div>
            <div style="flex: 2; display: flex; align-items: center;">
                <span class="ai-label">Сила атак/збоїв:</span>
                <input type="range" id="aiStrengthSlider" class="ai-slider" min="1" max="5" step="0.5" value="2.5" disabled>
                <span id="aiStrengthVal" style="color: var(--text-main); font-weight: bold; width: 30px; text-align: right;">2.5</span>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Налаштування Canvas ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    function resizeCanvas() {
        width = canvas.width = canvas.parentElement.clientWidth;
        height = canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let isActive = true;
    let isAnomalyAI = false;
    let filterSensitivity = 0.8;
    let aiStrength = 2.5; // Сила аномалії
    let blockedPackets = 0;
    
    let packetsA = 0;
    let packetsB = 0;

    const blockedEl = document.getElementById('val-blocked');
    const modeEl = document.getElementById('val-mode');
    const bwAEl = document.getElementById('val-bw-a');
    const bwBEl = document.getElementById('val-bw-b');

    const nodes = {
        sensor: { x: 0.1, y: 0.5, label: 'СЕНСОР\nДжерело даних', type: 'box' },
        gwA: { x: 0.5, y: 0.2, label: 'ТРАДИЦІЙНА АРХІТЕКТУРА', type: 'text' },
        gwB: { x: 0.5, y: 0.8, label: 'EDGE-МІКРОКОНТРОЛЕР\n(Фільтрація)', type: 'box' },
        cloud: { x: 0.9, y: 0.5, label: 'ХМАРНИЙ СЕРВЕР', type: 'box' }
    };

    class Packet {
        constructor(path, isSpike) {
            this.path = path; 
            this.x = nodes.sensor.x * width;
            this.y = nodes.sensor.y * height;
            this.progress = 0;
            this.speed = 0.015 + Math.random() * 0.005;
            this.isSpike = isSpike; 
            this.state = 'moving'; 
            this.targetY = path === 'A' ? nodes.gwA.y * height : nodes.gwB.y * height;
            
            // Якщо це пакет від сильного збою, він летить трохи хаотичніше
            this.wobble = isSpike ? (Math.random() - 0.5) * 20 : 0;
        }

        update() {
            if (this.state === 'dropping') {
                this.y += 5;
                this.x += 1;
                if (this.y > height + 20) return true; 
                return false;
            }

            this.progress += this.speed;
            this.x = (nodes.sensor.x + (nodes.cloud.x - nodes.sensor.x) * this.progress) * width;
            
            let baseY = 0;
            if (this.progress < 0.5) {
                baseY = (nodes.sensor.y + (nodes.targetY / height - nodes.sensor.y) * (this.progress * 2)) * height;
            } else {
                baseY = (this.targetY / height + (nodes.cloud.y - this.targetY / height) * ((this.progress - 0.5) * 2)) * height;
            }
            
            this.y = baseY + (Math.sin(this.progress * Math.PI * 4) * this.wobble);

            // Edge-фільтрація
            if (this.path === 'B' && this.progress >= 0.5 && this.progress < 0.5 + this.speed) {
                // ШІ збої можуть бути складнішими для відсікання
                let dynamicFilter = filterSensitivity * (1 - (aiStrength * 0.05)); 
                
                if (this.isSpike && Math.random() < dynamicFilter) {
                    this.state = 'dropping';
                    blockedPackets++;
                    blockedEl.innerText = blockedPackets;
                } else if (!isAnomalyAI && !this.isSpike && Math.random() < 0.7) {
                    this.state = 'dropping'; 
                }
            }

            if (this.progress >= 1 && this.state !== 'dropping') {
                if (this.path === 'A') packetsA++;
                if (this.path === 'B') packetsB++;
                return true; 
            }
            return false;
        }

        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.isSpike ? 5 : 4, 0, Math.PI * 2);
            
            if (this.state === 'dropping') {
                ctx.fillStyle = '#ef4444';
            } else if (this.isSpike) {
                ctx.fillStyle = '#a855f7'; // ШІ-пакети фіолетові
            } else {
                ctx.fillStyle = '#ffffff';
            }
            
            ctx.fill();
            if (this.isSpike && this.state !== 'dropping') {
                ctx.strokeStyle = '#d8b4fe';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }
    }

    let packets = [];

    function drawNode(node, isEdge = false) {
        ctx.fillStyle = isEdge ? '#2b303b' : 'rgba(255,255,255,0.05)';
        ctx.strokeStyle = isEdge ? '#10b981' : '#3f414d';
        ctx.lineWidth = 2;
        
        const nw = 150;
        const nh = 50;
        const nx = node.x * width - nw/2;
        const ny = node.y * height - nh/2;
        
        if (node.type === 'box') {
            if(isEdge) ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.roundRect(nx, ny, nw, nh, 6);
            ctx.fill();
            ctx.stroke();
            ctx.setLineDash([]);
        }

        ctx.fillStyle = '#94a1b2';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        const lines = node.label.split('\n');
        lines.forEach((line, i) => {
            ctx.fillText(line, node.x * width, node.y * height + (i * 14) - ((lines.length-1)*7));
        });
    }

    // --- Графіки ---
    Chart.defaults.color = '#94a1b2';
    Chart.defaults.font.size = 10;

    const sensorCtx = document.getElementById('sensorChart').getContext('2d');
    const sensorChart = new Chart(sensorCtx, {
        type: 'line',
        data: {
            labels: Array(60).fill(''),
            datasets: [{
                label: 'Сигнал (мВ)',
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                borderWidth: 2,
                data: Array(60).fill(0),
                pointRadius: 0,
                fill: true,
                tension: 0.1
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            scales: { y: { min: -150, max: 150, grid: { color: '#2b2b36' } }, x: { display: false } },
            plugins: { legend: { display: false } }
        }
    });

    const networkCtx = document.getElementById('networkChart').getContext('2d');
    const networkChart = new Chart(networkCtx, {
        type: 'line',
        data: {
            labels: Array(40).fill(''),
            datasets: [
                { label: 'Підхід А', borderColor: '#ef4444', borderWidth: 2, data: Array(40).fill(0), pointRadius: 0, tension: 0.3 },
                { label: 'Підхід Б', borderColor: '#10b981', borderWidth: 2, data: Array(40).fill(0), pointRadius: 0, tension: 0.3 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            scales: { y: { min: 0, max: 150, grid: { color: '#2b2b36' } }, x: { display: false } },
            plugins: { legend: { display: false } }
        }
    });

    let timeT = 0;

    function animate() {
        if (isActive) {
            ctx.clearRect(0, 0, width, height);

            ctx.strokeStyle = '#3f414d';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(nodes.sensor.x * width, nodes.sensor.y * height);
            ctx.lineTo(nodes.gwA.x * width, nodes.gwA.y * height);
            ctx.lineTo(nodes.cloud.x * width, nodes.cloud.y * height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(nodes.sensor.x * width, nodes.sensor.y * height);
            ctx.lineTo(nodes.gwB.x * width, nodes.gwB.y * height);
            ctx.lineTo(nodes.cloud.x * width, nodes.cloud.y * height);
            ctx.stroke();

            drawNode(nodes.sensor);
            drawNode(nodes.cloud);
            drawNode(nodes.gwB, true);
            
            ctx.fillStyle = '#94a1b2';
            ctx.fillText(nodes.gwA.label, nodes.gwA.x * width, nodes.gwA.y * height - 20);

            packets = packets.filter(p => { p.draw(ctx); return !p.update(); });
        }
        requestAnimationFrame(animate);
    }

    // Генерація фізичних даних
    setInterval(() => {
        if (!isActive) return;
        timeT += 0.2;
        
        let baseSignal = Math.sin(timeT) * 40; 
        let noise = (Math.random() - 0.5) * 10; 
        let isSpike = false;

        if (isAnomalyAI) {
            // Ймовірність та сила збою залежать від повзунка ШІ
            let spikeProbability = 0.05 + (aiStrength * 0.05); 
            
            if (Math.random() < spikeProbability) { 
                let spikeAmplitude = 50 + (aiStrength * 20); // Чим більша сила, тим більший виліт
                noise += (Math.random() > 0.5 ? spikeAmplitude : -spikeAmplitude); 
                isSpike = true;
                
                // Візуалізація дії ШІ на сенсорі
                ctx.fillStyle = `rgba(168, 85, 247, ${0.1 + (aiStrength * 0.05)})`;
                ctx.beginPath();
                ctx.arc(nodes.sensor.x * width, nodes.sensor.y * height, 30 + (aiStrength * 8), 0, Math.PI*2);
                ctx.fill();
            } else {
                noise += (Math.random() - 0.5) * 15 * aiStrength; // Загальний шум фону
            }
        }

        let finalValue = baseSignal + noise;
        
        sensorChart.data.datasets[0].data.push(finalValue);
        sensorChart.data.datasets[0].data.shift();
        sensorChart.data.datasets[0].borderColor = isSpike ? '#a855f7' : '#3b82f6'; // Фіолетовий при збої
        sensorChart.update();

        // Генерація пакетів
        if (isSpike) {
            let burstMultiplier = Math.ceil(aiStrength / 1.5); // Кількість пакетів залежить від сили
            for(let i=0; i < burstMultiplier; i++) {
                packets.push(new Packet('A', true));
                packets.push(new Packet('B', true));
            }
        } else if (Math.random() < 0.3) {
            packets.push(new Packet('A', false));
            packets.push(new Packet('B', false));
        }

    }, 100);

    // Оновлення мережевих метрик
    setInterval(() => {
        if (!isActive) return;
        let loadA = Math.min(150, packetsA * 8); 
        let loadB = Math.min(150, packetsB * 8);
        
        bwAEl.innerText = loadA > 100 ? '>100%' : loadA + '%';
        bwBEl.innerText = loadB + '%';

        networkChart.data.datasets[0].data.push(loadA);
        networkChart.data.datasets[0].data.shift();
        networkChart.data.datasets[1].data.push(loadB);
        networkChart.data.datasets[1].data.shift();
        networkChart.update();

        packetsA = 0; packetsB = 0;
    }, 500);

    // Обробники керування
    document.getElementById('filterSlider').addEventListener('input', (e) => {
        filterSensitivity = parseFloat(e.target.value);
        document.getElementById('filterVal').innerText = filterSensitivity.toFixed(1);
    });

    const aiStrengthSlider = document.getElementById('aiStrengthSlider');
    const aiStrengthVal = document.getElementById('aiStrengthVal');

    aiStrengthSlider.addEventListener('input', (e) => {
        aiStrength = parseFloat(e.target.value);
        aiStrengthVal.innerText = aiStrength.toFixed(1);
    });

    const anomalyBtn = document.getElementById('anomalyBtn');
    anomalyBtn.addEventListener('click', () => {
        isAnomalyAI = !isAnomalyAI;
        aiStrengthSlider.disabled = !isAnomalyAI;
        
        if (isAnomalyAI) {
            anomalyBtn.innerText = '🛑 Зупинити ШІ-генератор';
            anomalyBtn.classList.add('active-ai');
            modeEl.innerText = '🤖 АКТИВНО';
            modeEl.style.color = 'var(--accent-ai)';
        } else {
            anomalyBtn.innerText = '🤖 Активувати ШІ-генератор аномалій';
            anomalyBtn.classList.remove('active-ai');
            modeEl.innerText = 'Вимкнено';
            modeEl.style.color = 'var(--accent-green)';
            sensorChart.data.datasets[0].borderColor = '#3b82f6';
        }
    });

    document.getElementById('activeToggle').addEventListener('change', (e) => {
        isActive = e.target.checked;
    });

    animate();
</script>
</body>
</html>
