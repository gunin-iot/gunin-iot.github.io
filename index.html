<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIoT: Оптимізація Edge-обчислень (Модель із сенсором)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #16161a;
            --panel-bg: #24262d;
            --text-main: #e4e4e6;
            --text-muted: #94a1b2;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --border-color: #3f414d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard {
            background-color: var(--panel-bg);
            border-radius: 12px;
            width: 100%;
            max-width: 1000px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--text-main);
            display: block;
            margin-top: 4px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 250px;
            background-color: #1a1c23;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            overflow: hidden;
        }

        #simCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .charts-wrapper {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-container {
            flex: 1;
            height: 180px;
            background-color: #1a1c23;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background-color: #1a1c23;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        input[type=range] {
            flex-grow: 1;
            margin: 0 15px;
            accent-color: var(--accent-blue);
        }

        button {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: #4f5160;
        }

        button.active-anomaly {
            background-color: var(--accent-red);
            color: white;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-blue); }
        input:checked + .slider:before { transform: translateX(26px); }

        .chart-title {
            text-align: center;
            font-size: 0.8em;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

    </style>
</head>
<body>

<div class="dashboard">
    <div class="header-stats">
        <div>Архітектура Обміну Даними</div>
        <div>Блоковано (Б)<span class="stat-value" id="val-blocked">0</span></div>
        <div>Стан Середовища<span class="stat-value" id="val-mode" style="color: var(--accent-green)">СТАБІЛЬНИЙ</span></div>
        <div>Навантаження A<span class="stat-value" id="val-bw-a" style="color: var(--accent-red)">0%</span></div>
        <div>Навантаження B<span class="stat-value" id="val-bw-b" style="color: var(--accent-green)">0%</span></div>
    </div>

    <div class="canvas-container">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="charts-wrapper">
        <div class="chart-container">
            <div class="chart-title">Сирий фізичний сигнал (Дані сенсора)</div>
            <canvas id="sensorChart"></canvas>
        </div>
        <div class="chart-container">
            <div class="chart-title">Завантаження мережі (Пакети/с)</div>
            <canvas id="networkChart"></canvas>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Поріг відсікання (Edge)</label>
            <input type="range" id="filterSlider" min="0" max="1" step="0.1" value="0.8">
            <span id="filterVal">0.8</span>
        </div>
        <div class="control-group">
            <label>Робота системи</label>
            <label class="toggle-switch">
                <input type="checkbox" id="activeToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div>
            <button id="anomalyBtn">Згенерувати апаратний збій (Вильоти)</button>
        </div>
        <div>
            <button id="resetBtn">Скинути метрики</button>
        </div>
    </div>
</div>

<script>
    // --- Симуляція Canvas ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    function resizeCanvas() {
        width = canvas.width = canvas.parentElement.clientWidth;
        height = canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let isActive = true;
    let isAnomaly = false;
    let filterSensitivity = 0.8;
    let blockedPackets = 0;
    
    let packetsA = 0;
    let packetsB = 0;

    const blockedEl = document.getElementById('val-blocked');
    const modeEl = document.getElementById('val-mode');
    const bwAEl = document.getElementById('val-bw-a');
    const bwBEl = document.getElementById('val-bw-b');

    const nodes = {
        sensor: { x: 0.1, y: 0.5, label: 'СЕНСОР\n(Фізичний рівень)', type: 'box' },
        gwA: { x: 0.5, y: 0.2, label: 'ТРАДИЦІЙНИЙ ПІДХІД\n(Пряма передача)', type: 'text' },
        gwB: { x: 0.5, y: 0.8, label: 'EDGE-МІКРОКОНТРОЛЕР\n(Локальний аналіз)', type: 'box' },
        cloud: { x: 0.9, y: 0.5, label: 'ХМАРНИЙ СЕРВЕР', type: 'box' },
        bin: { x: 0.5, y: 1.05, label: '', type: 'bin' } // Приховано для чистоти
    };

    class Packet {
        constructor(path, isSpike) {
            this.path = path; 
            this.x = nodes.sensor.x * width;
            this.y = nodes.sensor.y * height;
            this.progress = 0;
            this.speed = 0.015 + Math.random() * 0.005;
            this.isSpike = isSpike; 
            this.state = 'moving'; 
            
            this.targetY = path === 'A' ? nodes.gwA.y * height : nodes.gwB.y * height;
        }

        update() {
            if (this.state === 'dropping') {
                this.y += 5;
                this.x += 1; // Відхилення у кошик
                if (this.y > height + 20) return true; 
                return false;
            }

            this.progress += this.speed;
            
            this.x = (nodes.sensor.x + (nodes.cloud.x - nodes.sensor.x) * this.progress) * width;
            
            if (this.progress < 0.5) {
                this.y = (nodes.sensor.y + (nodes.targetY / height - nodes.sensor.y) * (this.progress * 2)) * height;
            } else {
                this.y = (this.targetY / height + (nodes.cloud.y - this.targetY / height) * ((this.progress - 0.5) * 2)) * height;
            }

            // Логіка відсікання на Edge
            if (this.path === 'B' && this.progress >= 0.5 && this.progress < 0.5 + this.speed) {
                if (this.isSpike && Math.random() < filterSensitivity) {
                    this.state = 'dropping';
                    blockedPackets++;
                    blockedEl.innerText = blockedPackets;
                } else if (!isAnomaly && !this.isSpike && Math.random() < 0.7) {
                    // Адаптивне опитування
                    this.state = 'dropping'; 
                }
            }

            if (this.progress >= 1 && this.state !== 'dropping') {
                if (this.path === 'A') packetsA++;
                if (this.path === 'B') packetsB++;
                return true; 
            }
            return false;
        }

        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.isSpike ? 6 : 4, 0, Math.PI * 2);
            ctx.fillStyle = this.state === 'dropping' ? '#ef4444' : (this.isSpike ? '#f59e0b' : '#ffffff');
            ctx.fill();
            if (this.isSpike && this.state !== 'dropping') {
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
    }

    let packets = [];

    function drawNode(node, isEdge = false) {
        ctx.fillStyle = isEdge ? '#2b303b' : 'rgba(255,255,255,0.05)';
        ctx.strokeStyle = isEdge ? '#10b981' : '#3f414d';
        ctx.lineWidth = 2;
        
        const nw = 140;
        const nh = 50;
        const nx = node.x * width - nw/2;
        const ny = node.y * height - nh/2;
        
        if (node.type === 'box') {
            if(isEdge) ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.roundRect(nx, ny, nw, nh, 6);
            ctx.fill();
            ctx.stroke();
            ctx.setLineDash([]);
        }

        ctx.fillStyle = '#94a1b2';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        const lines = node.label.split('\n');
        lines.forEach((line, i) => {
            ctx.fillText(line, node.x * width, node.y * height + (i * 14) - ((lines.length-1)*7));
        });
    }

    // --- Графіки Chart.js ---
    Chart.defaults.color = '#94a1b2';
    Chart.defaults.font.size = 10;

    // Графік сирого сенсора
    const sensorCtx = document.getElementById('sensorChart').getContext('2d');
    const sensorChart = new Chart(sensorCtx, {
        type: 'line',
        data: {
            labels: Array(60).fill(''),
            datasets: [{
                label: 'Сигнал (мВ)',
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                borderWidth: 2,
                data: Array(60).fill(0),
                pointRadius: 0,
                fill: true,
                tension: 0.1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                y: { min: -100, max: 100, grid: { color: '#2b2b36' } },
                x: { display: false }
            },
            plugins: { legend: { display: false } }
        }
    });

    // Графік мережі
    const networkCtx = document.getElementById('networkChart').getContext('2d');
    const networkChart = new Chart(networkCtx, {
        type: 'line',
        data: {
            labels: Array(40).fill(''),
            datasets: [
                {
                    label: 'Підхід А',
                    borderColor: '#ef4444',
                    borderWidth: 2,
                    data: Array(40).fill(0),
                    pointRadius: 0,
                    tension: 0.3
                },
                {
                    label: 'Підхід Б',
                    borderColor: '#10b981',
                    borderWidth: 2,
                    data: Array(40).fill(0),
                    pointRadius: 0,
                    tension: 0.3
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                y: { min: 0, max: 100, grid: { color: '#2b2b36' } },
                x: { display: false }
            },
            plugins: { legend: { display: false } }
        }
    });

    let timeT = 0;
    let frameCount = 0;

    function animate() {
        if (isActive) {
            ctx.clearRect(0, 0, width, height);

            // Лінії
            ctx.strokeStyle = '#3f414d';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(nodes.sensor.x * width, nodes.sensor.y * height);
            ctx.lineTo(nodes.gwA.x * width, nodes.gwA.y * height);
            ctx.lineTo(nodes.cloud.x * width, nodes.cloud.y * height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(nodes.sensor.x * width, nodes.sensor.y * height);
            ctx.lineTo(nodes.gwB.x * width, nodes.gwB.y * height);
            ctx.lineTo(nodes.cloud.x * width, nodes.cloud.y * height);
            ctx.stroke();

            // Вузли
            drawNode(nodes.sensor);
            drawNode(nodes.cloud);
            drawNode(nodes.gwB, true);
            
            ctx.fillStyle = '#94a1b2';
            ctx.fillText(nodes.gwA.label, nodes.gwA.x * width, nodes.gwA.y * height - 20);

            // Оновлення пакетів
            packets = packets.filter(p => {
                p.draw(ctx);
                return !p.update();
            });
        }
        requestAnimationFrame(animate);
    }

    // Генерація фізичних даних (Сигнал сенсора)
    setInterval(() => {
        if (!isActive) return;
        timeT += 0.2;
        
        let baseSignal = Math.sin(timeT) * 40; // Основна корисна хвиля
        let noise = (Math.random() - 0.5) * 10; // Стандартний шум
        let isSpike = false;

        if (isAnomaly) {
            // Апаратні вильоти (Spikes)
            if (Math.random() < 0.25) { 
                noise += (Math.random() > 0.5 ? 90 : -90); 
                isSpike = true;
                
                // Візуалізація спалаху на сенсорі
                ctx.fillStyle = 'rgba(239, 68, 68, 0.3)';
                ctx.beginPath();
                ctx.arc(nodes.sensor.x * width, nodes.sensor.y * height, 40, 0, Math.PI*2);
                ctx.fill();
            } else {
                noise += (Math.random() - 0.5) * 40; // Підвищений загальний шум
            }
        }

        let finalValue = baseSignal + noise;
        
        // Оновлення графіка сенсора
        sensorChart.data.datasets[0].data.push(finalValue);
        sensorChart.data.datasets[0].data.shift();
        
        // Зміна кольору лінії при сильних вильотах
        sensorChart.data.datasets[0].borderColor = isSpike ? '#ef4444' : '#3b82f6';
        sensorChart.update();

        // Генерація пакетів у мережу на основі фізичних даних
        if (isSpike) {
            // При вильоті генерується багато пакетів (burst)
            packets.push(new Packet('A', true));
            packets.push(new Packet('A', true));
            packets.push(new Packet('B', true));
            packets.push(new Packet('B', true));
        } else if (Math.random() < 0.3) {
            // Звичайна передача
            packets.push(new Packet('A', false));
            packets.push(new Packet('B', false));
        }

    }, 100);

    // Оновлення метрик мережі
    setInterval(() => {
        if (!isActive) return;
        let loadA = Math.min(100, packetsA * 8); 
        let loadB = Math.min(100, packetsB * 8);
        
        bwAEl.innerText = loadA + '%';
        bwBEl.innerText = loadB + '%';

        networkChart.data.datasets[0].data.push(loadA);
        networkChart.data.datasets[0].data.shift();
        networkChart.data.datasets[1].data.push(loadB);
        networkChart.data.datasets[1].data.shift();
        networkChart.update();

        packetsA = 0;
        packetsB = 0;
    }, 500);

    // Управління
    document.getElementById('filterSlider').addEventListener('input', (e) => {
        filterSensitivity = parseFloat(e.target.value);
        document.getElementById('filterVal').innerText = filterSensitivity.toFixed(1);
    });

    const anomalyBtn = document.getElementById('anomalyBtn');
    anomalyBtn.addEventListener('click', () => {
        isAnomaly = !isAnomaly;
        if (isAnomaly) {
            anomalyBtn.innerText = 'Вимкнути апаратний збій';
            anomalyBtn.classList.add('active-anomaly');
            modeEl.innerText = 'ПЕРЕШКОДИ (ВИЛЬОТИ)';
            modeEl.style.color = 'var(--accent-red)';
        } else {
            anomalyBtn.innerText = 'Згенерувати апаратний збій (Вильоти)';
            anomalyBtn.classList.remove('active-anomaly');
            modeEl.innerText = 'СТАБІЛЬНИЙ';
            modeEl.style.color = 'var(--accent-green)';
            sensorChart.data.datasets[0].borderColor = '#3b82f6';
        }
    });

    document.getElementById('activeToggle').addEventListener('change', (e) => {
        isActive = e.target.checked;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        packets = [];
        blockedPackets = 0;
        blockedEl.innerText = '0';
        networkChart.data.datasets[0].data = Array(40).fill(0);
        networkChart.data.datasets[1].data = Array(40).fill(0);
        networkChart.update();
    });

    animate();
</script>
</body>
</html>
